    <script>
      /* 拾光导演 · 遗存清理（隐藏式）：
         只对匹配“商业版/商业授权/邮件咨询/使用手册/立即购买/使用教程/充值/邀请”等
         遗留入口的元素做 display:none 隐藏，绝不删除节点，避免破坏 React 渲染。 */
      (function () {
        var LEGACY_TEXT = [
          '商业版 / 商业授权', '商业版/商业授权', '邮件咨询', '官网',
          '使用手册', '立即购买', '使用教程', '打开账号站点',
          'Buy now', 'Setup guide', 'User guide', 'Open account site',
          '充值', '去充值', '邀请', '邀请码', '邀请链接', '邀请奖励', '去邀请'
        ];
        function norm(s) { return (s || '').replace(/\s+/g, ' ').trim(); }
        function hide(el) { if (!el || el.__sg_hidden) return; el.__sg_hidden = true; el.style.display = 'none'; }
        function clean() {
          try {
            var all = document.querySelectorAll('a,button,span');
            var changed = [];
            for (var i = 0; i < all.length; i++) {
              var el = all[i];
              if (!el || el.__sg_hidden) continue;
              var txt = norm(el.textContent);
              var href = (el.getAttribute && el.getAttribute('href')) || '';
              var hit = false;
              for (var j = 0; j < LEGACY_TEXT.length; j++) {
                if (txt === LEGACY_TEXT[j]) { hit = true; break; }
              }
              if (hit || href.indexOf('mailto:') === 0 || href.indexOf('tree456.com') !== -1) {
                hide(el);
                changed.push(el);
              }
            }
            /* 被隐藏项所在的容器若只剩“·”分隔符/无可见内容，则一并隐藏容器（如首页页脚那行） */
            for (var m = 0; m < changed.length; m++) {
              var p = changed[m].parentElement;
              if (!p || p.id === 'root' || p === document.body) continue;
              var kids = p.children;
              var visibleKids = [];
              for (var k = 0; k < kids.length; k++) {
                var c = kids[k];
                if (c.__sg_hidden) continue;
                var ct = norm(c.textContent);
                if (ct === '·') hide(c);
                else if (ct !== '') visibleKids.push(c);
              }
              if (visibleKids.length === 0 && norm(p.innerText) === '') hide(p);
            }
          } catch (e) { /* 忽略 */ }
        }
        clean();
        if (document.body) clean();
        if (document.readyState !== 'loading') {
          new MutationObserver(clean).observe(document.documentElement, { childList: true, subtree: true });
          clean();
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            new MutationObserver(clean).observe(document.documentElement, { childList: true, subtree: true });
            clean();
          });
        }
        [0, 300, 1000, 2500, 5000].forEach(function (t) { setTimeout(clean, t); });
      })();
    </script>
